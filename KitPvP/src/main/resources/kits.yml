# Add as many kits as you want. Material names: https://jd.papermc.io/paper/1.21.8/org/bukkit/Material.html
# Enchant names are vanilla ids (sharpness, protection, power, fire_aspect, ...).
# Potion effects are infinite while the kit is active: <effect_id>: <amplifier>  (0 = level I)
# price: coins to unlock permanently (0 = free). permission: optional (e.g. a rank kit).
kits:
  warrior:
    display: "<red><bold>Warrior"
    icon: IRON_SWORD
    price: 0
    cooldown: 0
    description:
      - "Balanced fighter."
    armor:
      helmet: { material: IRON_HELMET }
      chestplate: { material: IRON_CHESTPLATE }
      leggings: { material: IRON_LEGGINGS }
      boots: { material: IRON_BOOTS }
    items:
      sword:
        material: IRON_SWORD
        name: "<red>Warrior Blade"
        enchants: { sharpness: 1 }
      apples:
        material: GOLDEN_APPLE
        amount: 2
      heal:
        material: SPLASH_POTION
        potion: STRONG_HEALING
        amount: 3

  archer:
    display: "<green><bold>Archer"
    icon: BOW
    price: 0
    cooldown: 0
    description:
      - "Ranged damage with infinite arrows."
    armor:
      helmet: { material: LEATHER_HELMET }
      chestplate: { material: LEATHER_CHESTPLATE }
      leggings: { material: LEATHER_LEGGINGS }
      boots: { material: CHAINMAIL_BOOTS }
    items:
      sword:
        material: STONE_SWORD
      bow:
        material: BOW
        name: "<green>Longbow"
        enchants: { power: 2, infinity: 1 }
      arrow:
        material: ARROW

  tank:
    display: "<gray><bold>Tank"
    icon: DIAMOND_CHESTPLATE
    price: 500
    cooldown: 0
    description:
      - "Heavy armor, but slower."
    armor:
      helmet: { material: IRON_HELMET }
      chestplate: { material: DIAMOND_CHESTPLATE }
      leggings: { material: DIAMOND_LEGGINGS }
      boots: { material: IRON_BOOTS }
    items:
      sword:
        material: STONE_SWORD
        enchants: { knockback: 1 }
    effects:
      slowness: 0
      resistance: 0

  assassin:
    display: "<dark_purple><bold>Assassin"
    icon: ENDER_PEARL
    price: 1000
    cooldown: 0
    description:
      - "Fast and deadly, but fragile."
    armor:
      helmet: { material: LEATHER_HELMET }
      chestplate: { material: LEATHER_CHESTPLATE }
      leggings: { material: LEATHER_LEGGINGS }
      boots: { material: LEATHER_BOOTS }
    items:
      sword:
        material: IRON_SWORD
        enchants: { sharpness: 2 }
      pearls:
        material: ENDER_PEARL
        amount: 2
    effects:
      speed: 1

  vip:
    display: "<gold><bold>VIP"
    icon: DIAMOND_SWORD
    price: 0
    cooldown: 0
    permission: kitpvp.kit.vip
    description:
      - "Rank-exclusive kit."
    armor:
      helmet: { material: DIAMOND_HELMET, enchants: { protection: 1 } }
      chestplate: { material: DIAMOND_CHESTPLATE, enchants: { protection: 1 } }
      leggings: { material: DIAMOND_LEGGINGS, enchants: { protection: 1 } }
      boots: { material: DIAMOND_BOOTS, enchants: { protection: 1 } }
    items:
      sword:
        material: DIAMOND_SWORD
        enchants: { sharpness: 1 }
      apples:
        material: GOLDEN_APPLE
        amount: 4
